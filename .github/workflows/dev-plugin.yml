name: Verify Runway Dev plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - run: npm --prefix tooling ci --ignore-scripts
      - run: npm --prefix tooling run check
      - run: npm --prefix tooling run typecheck
      - name: Fetch and verify portable schemas
        run: |
          mkdir -p .build/schemas
          curl --fail --silent --show-error --max-time 30 https://agent-plugins.org/schemas/1.0.0/plugin.schema.json -o .build/schemas/plugin.schema.json
          curl --fail --silent --show-error --max-time 30 https://agent-plugins.org/schemas/1.0.0/mcp.schema.json -o .build/schemas/mcp.schema.json
          shasum -a 256 -c tooling/scripts/portable-schemas.sha256
      - run: npm --prefix tooling test
      - run: npm --prefix tooling run build:plugin
      - run: npm --prefix tooling run validate:plugin
